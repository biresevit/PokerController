[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-controller"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<17", "httpx>=0.28,<1", "pyodbc>=5,<6", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
poker-controller = "poker_controller.cli:main"
poker-controller-worker = "poker_controller.worker:main"

[tool.setuptools.packages.find]
include = ["poker_controller*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
